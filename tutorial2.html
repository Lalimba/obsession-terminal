function showATR() {
    const lang = document.getElementById("language").value;
    let content = "";

    if (lang === "english") {
        content = `
            <h2>ATR - Average True Range</h2>
            <p>ATR measures market volatility. It tells traders how much price moves on average.</p>

    else if (lang === "tigrigna") {
        content = `
            <h2>ATR - Average True Range</h2>

 ንሱ ዝነግረካ እቲ ዋጋ ብክንደይ ብርታዔ ይናወጽ ከምዘሎ ጥራይ እዩ።
            ዋጋ ብኽንደይ ናሕሪ ይንቀሳቐስ ከምዘሎ ይሕብር።
            </p>
<p>

      ንምንታይ የገልግል? (Trading Use Case)ንናይ Stop Loss መውሰኒ፦ ነጋዶ ንስቶፕ-ሎስ (Stop Loss) ክሰርዑ ከለዉ፡ እቲ ATR ዝለዓለ እንተኾይኑ፡

      <div class="step">ትሑት ATR = ዝተረጋገአ ዕዳጋ</div>
            <div class="step">ዝለዓለ ATR = ብርቱዕ ምንቅስቓስ</div>
            <div class="step">ATR ን Stop Loss ምቕማጥ ይሕግዝ</div>
        `;
    } 
    else {
        content = `
            <h2>ATR - Average True Range</h2>

            <h3>English</h3>
            <p>ATR measures market volatility. It tells traders how much price moves on average.</p>

function showBB(){

const lang=document.getElementById("language").value;

let content="";

if(lang==="english"){

content=`

<h2>Bollinger Bands</h2>

<p>

Bollinger Bands are volatility indicators that help traders understand
whether the market is expanding or contracting.

They consist of three lines:

• Upper Band

• Middle Band (Moving Average)

• Lower Band

</p>

<div class="step">

Price near Upper Band

→ Market may be overbought

</div>

<div class="step">

Price near Lower Band

→ Market may be oversold

</div>

<div class="step">

Bands become narrow (Squeeze)

→ A large move may come soon

</div>

<div class="step">

Wide bands

→ Strong market volatility

</div>

`;

}

else if(lang==="tigrigna"){

content=`

<h2>Bollinger Bands</h2>

<p>

 (Bollinger Bands)፡ ዕዳጋ ይገፍሕ (ይሰፍሕ) ወይስ ይጸብብ ከም ዘሎ ንነጋዶ ን ምርዳእ ዝሕግዙ ናይ ተለዋዋጥነት መመልከቲታት (volatility indicators) እዮ</p>
<p>
3 መስመራት ኣለዎ፦
</p>
• Upper Band (ላዕለዋይ መስመር)

• Middle Band (ማእከላይ Moving Average)

• Lower Band (ታሕተዋይ መስመር)

</p>

<div class="step">

ዋጋ ናብ Upper Band
እንተቐረቡ

• 0.236

• 0.382

• 0.500

• 0.618 (Golden Zone)

• 0.786

</p>

<div class="step">

0.382

→ Small pullback

</div>

<div class="step">

0.5

→ Medium pullback

</div>

<div class="step">

</div>

 ናብ ላዕሊ ወይ ናብ ታሕቲ ድሕሪ ምጉዓዙ፡ ንድሕሪት ተመሊሱ (Pullback)  ደው ክብልን መሊሱ ክቕጽልን ከም ዝኽእል ንምግማት ዝጥቀሙሉ ናይ ቴክኒካዊ ትንተና መሳርሒ (Trading tool) እዩ።

function showEMA(){

const lang=document.getElementById("language").value;

let content="";

if(lang==="english"){

content=`

<h2>EMA - Exponential Moving Average</h2>

<p>

EMA is a trend-following indicator.

It shows the average price,
but gives more importance
to recent prices.

Because of this,
EMA reacts faster than
a normal Moving Average.

</p>

<div class="step">

EMA 20

→ Short-term trend

</div>

<div class="step">

EMA 50

→ Medium-term trend

</div>

<div class="step">

EMA 200

→ Long-term trend

</div>

<div class="step">

Price above EMA

→ Bullish market

</div>

<div class="step">

Price below EMA

→ Bearish market

</div>

<div class="step">

EMA should be combined with:

Support/Resistance
+ Candlestick confirmation
+ Market Structure

</div>

`;

}

function showRSI(){

const lang=document.getElementById("language").value;

let content="";

if(lang==="english"){

content=`

<h2>RSI - Relative Strength Index</h2>

<p>

RSI is a momentum indicator.

It helps traders understand
whether price is becoming
too strong or too weak.

RSI moves between 0 and 100.

</p>

<div class="step">

RSI above 70

→ Market may be overbought

</div>

<div class="step">

RSI below 30

→ Market may be oversold

</div>

<div class="step">

Bullish divergence

→ Sellers may be getting weak

</div>

<div class="step">

Bearish divergence

→ Buyers may be getting weak

</div>

`;

}

else if(lang==="tigrigna"){

content=`

<h2>RSI - Relative Strength Index</h2>

<p>

RSI ብቁልጡፍ ናይ ዋጋ ምልዋጥ ምኽንያት፡ ልዕሊ ዓቐን ተተገዚኡ (Overbought) ወይስ ልዕሊ ዓቐን ተተሸይጡ (Oversold) ከም ዘሎ ንምፍላጥ ዘገልግል ናይ ሞመንተም ወይ ናይ ዋጋ ናህሪ መመልከቲ (momentum indicator) እዩ።"

ዋጋ ብርቱዕ
ወይ ደኹም
ከምዘሎ
ንምርዳእ ይሕግዝ።

RSI
ካብ 0 ክሳብ 100
ይንቀሳቐስ።

</p>

<div class="step">

RSI ልዕሊ 70

→ Overbought ወይ ልዕሊ ዓቀን ተገዚኡ<p>
→ እቲ ዋጋ ንነዊሕ ግዜ ብሓያል ቅልጣፌ ናብ ላዕሊ ስለ ዝደየበ፡ እቲ ዕዳጋ "ደኺሙ" ኣሎ ማለት እዩ። ኣብዚ እዋን እዚ ሓደ ናይ ዋጋ ምጉዳል (Dump) ወይ ድማ ሪቨርሳል (Reversal) ክመጽእ ስለ ዝኽእል፡ ሓደ ናይ መሸጢ ምልክት (Sell Signal) ክኸውን ይኽእል</p>
</div>

<div class="step">

RSI ትሕቲ 30

→ Oversold ልዕሊ ዓቀን ተሸይጡ

</div>
<div class="step">
ደረጃ 50 (ማእከላይ መስመር)፦ እቲ ዋጋ ኣብ ማእከል ምስ ዝህሉ፡ እቲ ትረንድ ንየናይ ሸነኽ ይዳሎ ከምዘሎ (Bullish ወይ Bearish) ንምፍላጥ የመልክት።

</div>
<div class="step">

Bullish divergence

→ Sellers ይደኽሙ ኣለዉ

</div>

<div class="step">

Bearish divergence

→ Buyers ይደኽሙ ኣለዉ

</div>

`;

}

else{

content=`

<h2>MACD - Moving Average Convergence Divergence</h2>

 ክንደይ ምዃኑን ንምፍላጥ ዝሕግዝ ናይ ቴክኒካዊ ትንተና መመልከቲ (indicator) እዩ።"

• Signal Line (ናይ ምልክት መስመር)፦ እቲ ናይ መሸጢ ወይ መግዝኢ ግዜ ንምውሳን ዘገልግል ቀስ ዝበለ መስመር እዩ።
